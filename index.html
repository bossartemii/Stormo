<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Stormo — AI agent swarm simulator for forecasting reactions to news, products and decisions. Mobile-first.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stormo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Stormo</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--acc:#0ea5e9;--acc2:#6366f1;--pos:#16a34a;--neg:#dc2626;--neu:#94a3b8;--chip:#eef2ff;--shadow:0 1px 2px rgba(15,23,42,.06)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#131a2e;--ink:#e6eaf5;--muted:#93a0bd;--line:#232c47;--chip:#1c2545;--shadow:none}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#131a2e;--ink:#e6eaf5;--muted:#93a0bd;--line:#232c47;--chip:#1c2545;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
.brand img{width:26px;height:26px}
.topr{display:flex;align-items:center;gap:8px;min-width:0}
.status{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.langs{display:flex;background:var(--chip);border-radius:99px;padding:2px;flex:0 0 auto}
.langs button{border:0;background:none;color:var(--muted);font:700 11px system-ui,sans-serif;padding:4px 7px;border-radius:99px;cursor:pointer}
.langs button.on{background:var(--card);color:var(--ink)}
main{padding:12px 16px calc(90px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.view{display:none}.view.active{display:block}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 6px}
label:first-child{margin-top:0}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:130px;resize:vertical}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--acc)}
.chk{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:14px}
.chk input{width:22px;height:22px;flex:0 0 22px;accent-color:var(--acc)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;width:100%;cursor:pointer}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.small{padding:8px 12px;font-size:13px;width:auto}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{flex:1;min-width:0;border:0;background:none;color:var(--muted);font:600 11px system-ui,sans-serif;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button span{font-size:20px;line-height:1}
.tabs button.on{color:var(--acc)}
.prog{height:6px;background:var(--chip);border-radius:9px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
.post{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.post:first-child{border-top:0}
.post.reply{margin-left:28px;padding-top:8px;border-top:0}
.av{flex:0 0 34px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.post.reply .av{flex-basis:26px;width:26px;height:26px;font-size:11px}
.pbody{min-width:0;flex:1}
.pmeta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px}
.pmeta b{color:var(--ink);font-size:13px}
.ptext{margin-top:3px;word-wrap:break-word}
.pfoot{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:12px;align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.event{background:linear-gradient(135deg,rgba(14,165,233,.12),rgba(99,102,241,.12));border:1px dashed var(--acc);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.agent{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.agent:first-child{border-top:0}
.agent .info{flex:1;min-width:0}
.agent .info small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stance{position:relative;height:6px;background:var(--chip);border-radius:9px;margin-top:6px}
.stance i{position:absolute;top:0;height:100%;border-radius:9px}
.stance:after{content:"";position:absolute;left:50%;top:-2px;width:1px;height:10px;background:var(--muted)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.bars{display:flex;height:12px;border-radius:9px;overflow:hidden;margin-top:10px;background:var(--chip)}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.md h2{font-size:18px;margin:18px 0 8px}.md h3{font-size:16px;margin:14px 0 6px}.md h4{font-size:15px;margin:12px 0 6px}
.md p{margin:8px 0}.md ul,.md ol{padding-left:20px;margin:8px 0}.md li{margin:4px 0}
.hist{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}
.hist .t{flex:1;min-width:0;cursor:pointer}
.hist .t small{display:block;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .in{background:var(--card);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.bubble{padding:10px 12px;border-radius:14px;margin:8px 0;max-width:88%}
.bubble.q{background:var(--chip);margin-left:auto}
.bubble.a{background:var(--bg);border:1px solid var(--line)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));background:#0f172a;color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;max-width:688px;margin:0 auto}
.toast.show{opacity:1;transform:none}
.val{float:right;color:var(--ink);font-weight:700}
svg text{fill:var(--muted);font-size:10px;font-family:system-ui,sans-serif}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.svg" alt="">Stormo</div>
  <div class="topr">
    <div id="status" class="status"></div>
    <div class="langs" id="langs"><button data-l="it">IT</button><button data-l="en">EN</button><button data-l="ru">RU</button></div>
  </div>
</header>

<main>
<!-- SCENARIO -->
<section id="v-scenario" class="view active">
  <h2 data-i18n="new_forecast"></h2>
  <div class="card">
    <label for="f-title" data-i18n="title"></label>
    <input id="f-title" data-i18n-ph="title_ph">
    <label for="f-seed" data-i18n="seed"></label>
    <textarea id="f-seed" data-i18n-ph="seed_ph"></textarea>
    <div class="row">
      <button class="btn sec small" id="b-file" data-i18n="load_txt"></button>
      <button class="btn sec small" id="b-example" data-i18n="example"></button>
    </div>
    <input type="file" id="f-file" accept=".txt,.md,.csv,text/plain" hidden>
    <label for="f-question" data-i18n="question"></label>
    <input id="f-question" data-i18n-ph="question_ph">
    <label for="f-platform" data-i18n="platform"></label>
    <select id="f-platform"></select>
    <label for="f-agents"><span data-i18n="agents"></span> <span class="val" id="o-agents">12</span></label>
    <input type="range" id="f-agents" min="4" max="40" value="12">
    <label for="f-rounds"><span data-i18n="rounds"></span> <span class="val" id="o-rounds">4</span></label>
    <input type="range" id="f-rounds" min="1" max="8" value="4">
    <div class="hint" id="o-cost"></div>
    <div class="row"><button class="btn" id="b-start" data-i18n="start"></button></div>
  </div>
  <div class="card">
    <h3 data-i18n="saved"></h3>
    <div id="history"></div>
  </div>
</section>

<!-- SIMULAZIONE -->
<section id="v-sim" class="view">
  <div class="card">
    <h3 id="s-title"></h3>
    <div class="prog"><i id="s-prog"></i></div>
    <div class="hint" id="s-step"></div>
    <div class="row">
      <button class="btn sec" id="b-pause" disabled></button>
      <button class="btn sec" id="b-more" disabled data-i18n="more"></button>
    </div>
  </div>
  <div class="card">
    <h3 data-i18n="inject_title"></h3>
    <textarea id="f-event" style="min-height:70px" data-i18n-ph="event_ph"></textarea>
    <div class="row"><button class="btn sec" id="b-event" data-i18n="inject_btn"></button></div>
    <div class="hint" data-i18n="inject_hint"></div>
  </div>
  <div class="card">
    <h3 data-i18n="chart_title"></h3>
    <div id="chart"></div>
    <div id="dist"></div>
  </div>
  <div class="card">
    <h3 data-i18n="feed"></h3>
    <div id="feed"></div>
  </div>
</section>

<!-- AGENTI -->
<section id="v-agents" class="view">
  <h2 data-i18n="agents_title"></h2>
  <div class="hint" style="margin:-6px 0 10px" data-i18n="agents_hint"></div>
  <div class="card" id="agents"></div>
</section>

<!-- REPORT -->
<section id="v-report" class="view">
  <h2 data-i18n="report_title"></h2>
  <div class="card md" id="report"></div>
  <div class="row"><button class="btn" id="b-report" data-i18n="gen_report"></button></div>
  <div class="row">
    <button class="btn sec" id="b-share" data-i18n="share"></button>
    <button class="btn sec" id="b-md">⬇ .md</button>
    <button class="btn sec" id="b-json">⬇ .json</button>
  </div>
</section>

<!-- IMPOSTAZIONI -->
<section id="v-settings" class="view">
  <h2 data-i18n="settings_title"></h2>
  <div class="card">
    <label for="c-ui" data-i18n="ui_lang"></label>
    <select id="c-ui"><option value="it">Italiano</option><option value="en">English</option><option value="ru">Русский</option></select>
    <label for="c-provider" data-i18n="engine"></label>
    <select id="c-provider"></select>
    <label for="c-base" data-i18n="api_url"></label>
    <input id="c-base" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="c-model" data-i18n="model"></label>
    <input id="c-model" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="c-key" data-i18n="api_key"></label>
    <input id="c-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-…">
    <div class="hint" data-i18n="key_hint"></div>
    <label class="chk" style="margin-top:14px"><input type="checkbox" id="c-proxy"><span data-i18n="proxy"></span></label>
    <div class="hint" id="o-proxy"></div>
    <label for="c-lang" data-i18n="sim_lang"></label>
    <select id="c-lang"></select>
    <label for="c-theme" data-i18n="theme"></label>
    <select id="c-theme"><option value="" data-i18n="th_auto"></option><option value="light" data-i18n="th_light"></option><option value="dark" data-i18n="th_dark"></option></select>
    <div class="row">
      <button class="btn sec" id="b-test" data-i18n="test"></button>
      <button class="btn" id="b-save" data-i18n="save"></button>
    </div>
  </div>
  <div class="card">
    <h3 data-i18n="how_title"></h3>
    <div class="hint" style="font-size:13px" data-i18n-html="how"></div>
  </div>
</section>
</main>

<nav class="tabs">
  <button data-v="scenario" class="on"><span>📝</span><b data-i18n="tab_scenario" style="font-weight:600"></b></button>
  <button data-v="sim"><span>🌊</span><b data-i18n="tab_sim" style="font-weight:600"></b></button>
  <button data-v="agents"><span>👥</span><b data-i18n="tab_agents" style="font-weight:600"></b></button>
  <button data-v="report"><span>📊</span><b data-i18n="tab_report" style="font-weight:600"></b></button>
  <button data-v="settings"><span>⚙️</span><b data-i18n="tab_settings" style="font-weight:600"></b></button>
</nav>

<div class="sheet" id="sheet"><div class="in"><div class="grab"></div><div id="sheet-body"></div></div></div>
<div class="toast" id="toast"></div>

async function llm(system, user, maxTokens = 2500) {
  const p = PRESETS[settings.provider];

  if (!settings.key && settings.provider !== 'custom') throw new UserError(t('need_key'));
  let res, data;

      res = await fetch(via(base + '/chat/completions'), { method: 'POST', headers, body: JSON.stringify({ model, temperature: 0.9, max_tokens: maxTokens, messages: [{ role: 'system', content: system }, { role: 'user', content: user }] }) });
      data = await res.json().catch(() => ({}));
      if (!res.ok) throw new UserError(errText(data, res));
      return data.choices?.[0]?.message?.content || '';
    }
    if (p.kind === 'anthropic') {
      res = await fetch(via(base + '/messages'), { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-api-key': settings.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body: JSON.stringify({ model, max_tokens: maxTokens, temperature: 0.9, system, messages: [{ role: 'user', content: user }] }) });
      data = await res.json().catch(() => ({}));
      if (!res.ok) throw new UserError(errText(data, res));
      return (data.content || []).map(c => c.text || '').join('');
    }
    if (p.kind === 'gemini') {
      res = await fetch(via(`${base}/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(settings.key)}`), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents: [{ role: 'user', parts: [{ text: user }] }], generationConfig: { temperature: 0.9, maxOutputTokens: maxTokens } }) });
      data = await res.json().catch(() => ({}));
      if (!res.ok) throw new UserError(errText(data, res));
      return (data.candidates?.[0]?.content?.parts || []).map(x => x.text || '').join('');
    }
  } catch (e) {
    if (e instanceof TypeError) throw new UserError(t('conn_fail'));
    throw e;
  }

}
function parseJSON(txt) {

  const s = txt.search(/[\[{]/); if (s < 0) throw new Error(t('bad_json'));

  return JSON.parse(txt.slice(s, txt.lastIndexOf(close) + 1));
}

    title: $('#f-title').value.trim() || t('sim_default') + ' ' + new Date().toLocaleDateString(LOCALES[settings.ui]),
    seed: $('#f-seed').value.trim(), question: $('#f-question').value.trim() || t('default_q'),
    platform: $('#f-platform').value, nAgents: +$('#f-agents').value, nRounds: +$('#f-rounds').value, lang: settings.lang,
    agents: [], posts: [], events: [], stanceHistory: [], round: 0, seq: 0, status: 'new', report: '', chats: {}, engine: settings.provider
  };
}
function statusLabel(s) { const k = 'st_' + s; return I18N.en[k] ? t(k) : s; }

/* =================== fasi della simulazione =================== */
async function genAgents() {
  const n = sim.nAgents; let agents = [];
  if (isDemo()) { await sleep(600); agents = demoAgents(n); }
  else {
    for (const size of chunk(Array.from({ length: n }), 15).map(c => c.length)) {
      const already = agents.map(a => a.nome).join(', ');
      const arr = await llmJSON(SYS(), `PLATFORM: ${platformEN()}
SCENARIO:
${sim.seed.slice(0, 4000)}

QUESTION TO FORECAST: ${sim.question}

Create ${size} realistic people who are very different from each other (age, job, class, place, values, how informed they are) and who would plausibly join this discussion. Include supporters, opponents, undecided people, experts, ordinary people and media/influencers in realistic proportions.${already ? ' They must be different from: ' + already + '.' : ''}
"posizione" goes from -1 (fully against / negative about the scenario) to 1 (fully in favour / positive). "influenza" from 1 to 10 (reach and credibility).
Keep the JSON keys exactly as shown; write the values in ${sim.lang}.
Reply with a JSON array:
[{"nome":"","eta":0,"ruolo":"","gruppo":"e.g. citizens, experts, media, business","personalita":"character and writing style in a few words","motivazione":"what they really care about","posizione":0,"influenza":5}]`, 4000);
      if (!Array.isArray(arr)) throw new Error(t('bad_agents'));
      agents = agents.concat(arr.slice(0, size));
    }
  }
  return agents.map((a, i) => ({
    id: 'a' + (i + 1), nome: String(a.nome || 'Agent ' + (i + 1)), eta: a.eta || '', ruolo: String(a.ruolo || ''), gruppo: String(a.gruppo || '—'),
    personalita: String(a.personalita || ''), motivazione: String(a.motivazione || ''),
    posizione: clamp(a.posizione), posizione0: clamp(a.posizione), influenza: Math.round(clamp(a.influenza || 5, 1, 10))
  }));
}

function feedSummary() {
  return sim.posts.slice(-30).map(p => {
    if (p.type === 'evento') return `[EVENT, round ${p.round}] ${p.text}`;
    const a = agentById(p.author);
    return `[${p.id}] ${a ? a.nome : '?'} (${a ? a.ruolo : ''})${p.replyTo ? ' replying to ' + p.replyTo : ''}: ${p.text.slice(0, 220)} [${p.likes || 0} likes]`;
  }).join('\n');
}

async function roundBatch(r, batch, feed, ev) {
  if (isDemo()) { await sleep(350); return demoRound(batch, ev); }
  const arr = await llmJSON(SYS(), `PLATFORM: ${platformEN()}
SCENARIO:
${sim.seed.slice(0, 3500)}

QUESTION TO FORECAST: ${sim.question}
ROUND ${r} of ${sim.nRounds}.
${ev.length ? 'NEW EVENT THAT JUST HAPPENED (everyone knows about it): ' + ev.join(' | ') + '\n' : ''}
RECENT FEED:
${feed || '(still empty: they are the first to react)'}

AGENTS ACTING NOW:
${batch.map(a => `${a.id} | ${a.nome}, ${a.eta}, ${a.ruolo} (${a.gruppo}) | character: ${a.personalita} | cares about: ${a.motivazione} | current stance ${a.posizione.toFixed(2)} | influence ${a.influenza}`).join('\n')}

For EACH agent choose a realistic action for this platform: "post" (new content), "risposta" (reply to a feed post: put its id in target), "like" (put target), "silenzio" (stay silent).
People who are not very involved often just like or stay silent. Agents can change their mind when exposed to strong arguments or influential people, but with inertia. Not everyone has to agree.
Write "testo" in ${sim.lang}. Reply with a JSON array, one object per agent:
[{"agente":"a1","azione":"post","target":null,"testo":"max 280 characters in the character's style","sentimento":0,"posizione":0}]
"sentimento" and "posizione" go from -1 to 1; "posizione" is the agent's updated stance after this round.`, 3000);
  return Array.isArray(arr) ? arr : [];
}

function applyAction(r, a) {
  const ag = agentById(String(a.agente || '').trim()); if (!ag) return;
  if (a.posizione !== undefined && a.posizione !== null) ag.posizione = clamp(a.posizione);
  const act = String(a.azione || '').toLowerCase();
  const target = a.target ? sim.posts.find(p => p.id === String(a.target).replace(/[\[\]]/g, '').trim() && p.type !== 'evento') : null;
  if (act.startsWith('like')) { if (target) { target.likes = (target.likes || 0) + 1; (target.likedBy = target.likedBy || []).push(ag.id); } return; }
  if (act.startsWith('silen') || act.startsWith('silent') || !a.testo) return;
  const isReply = (act.startsWith('rispo') || act.startsWith('repl')) && target;
  sim.posts.push({ id: 'p' + (++sim.seq), type: 'post', round: r, author: ag.id, parent: isReply ? (target.parent || target.id) : null, replyTo: isReply ? target.id : null, text: String(a.testo).slice(0, 600), sent: clamp(a.sentimento), likes: 0 });
}

async function runRound(r, ev) {
  const feed = feedSummary();
  const order = [...sim.agents].sort(() => Math.random() - 0.5);
  const batches = chunk(order, 6); let fails = 0, lastErr;
  const results = await pool(batches.map(b => async () => {
    try { return await roundBatch(r, b, feed, ev); } catch (e) { fails++; lastErr = e; return []; }
  }), 3);
  if (fails === batches.length) throw lastErr;
  if (fails) toast(t('batch_fail', { r, f: fails }));
  results.flat().sort(() => Math.random() - 0.5).forEach(a => applyAction(r, a));
}

async function runSim() {
  if (running || !sim) return;
  running = true; paused = false; sim.status = 'running'; renderAll();
  try {
    if (!sim.agents.length) {
      setStep(t('creating'), 3);
      sim.agents = await genAgents();
      sim.stanceHistory = [avgStance()]; saveSim(); renderAll();
    }
    while (sim.round < sim.nRounds && !paused) {
      const r = sim.round + 1;
      const ev = pendingEvents.splice(0);
      ev.forEach(x => { sim.events.push({ round: r, text: x }); sim.posts.push({ id: 'e' + (++sim.seq), type: 'evento', round: r, text: x }); });
      setStep(t('round_x', { r, n: sim.nRounds }), 5 + 85 * (r - 1) / sim.nRounds);
      await runRound(r, ev);
      sim.round = r; sim.stanceHistory.push(avgStance()); saveSim(); renderAll();
    }
    if (sim.round >= sim.nRounds) {
      sim.status = 'done';
      setStep(t('writing_report'), 94);
      await genReport();
      setStep(t('done_msg'), 100);
      toast(t('report_ready'));
    } else { sim.status = 'paused'; }
  } catch (e) {
    sim.status = 'error'; sim.lastError = e.message; toast(t('error_msg', { e: e.message }));
  }
  running = false; saveSim(); renderAll();
}

async function genReport() {
  if (!sim || !sim.agents.length) return toast(t('need_sim'));
  const replies = id => sim.posts.filter(x => x.replyTo === id).length;
  const top = sim.posts.filter(p => p.type === 'post').map(p => ({ p, s: (p.likes || 0) + 2 * replies(p.id) })).sort((a, b) => b.s - a.s).slice(0, 12);
  const groups = {};
  sim.agents.forEach(a => { (groups[a.gruppo] = groups[a.gruppo] || []).push(a); });
  if (isDemo()) { await sleep(700); sim.report = demoReport(top, groups); saveSim(); renderReport(); return; }
  const avg = (l, k) => (l.reduce((s, a) => s + a[k], 0) / l.length).toFixed(2);
  const data = `SCENARIO:
${sim.seed.slice(0, 3500)}

QUESTION: ${sim.question}
PLATFORM: ${platformEN()} | ${sim.agents.length} agents | ${sim.round} rounds
INJECTED EVENTS: ${sim.events.map(e => `round ${e.round}: ${e.text}`).join(' | ') || 'none'}
INFLUENCE-WEIGHTED AVERAGE STANCE PER ROUND (-1..1): ${sim.stanceHistory.map(v => v.toFixed(2)).join(' → ')}
GROUPS (average stance start → end):
${Object.entries(groups).map(([g, l]) => `${g} (${l.length}): ${avg(l, 'posizione0')} → ${avg(l, 'posizione')}`).join('\n')}
AGENTS (start → end, influence):
${sim.agents.map(a => `${a.nome}, ${a.ruolo}: ${a.posizione0.toFixed(2)} → ${a.posizione.toFixed(2)} (inf. ${a.influenza})`).join('\n')}
MOST RELEVANT POSTS:
${top.map(({ p }) => { const a = agentById(p.author); return `- ${a ? a.nome : '?'} (round ${p.round}, ${p.likes || 0} likes, ${replies(p.id)} replies): ${p.text}`; }).join('\n')}`;
  sim.report = await llm(`You are an expert analyst of public opinion, markets and social behaviour. Write in ${sim.lang}, in Markdown, clear and concrete, no fluff. Base your analysis on the simulation data but also use common sense: a simulation with few agents is indicative, not certain.`,
`${data}

Write the FORECAST REPORT with these sections (translate the headings into ${sim.lang}, use ## for each):
1. Summary (3-4 sentences)
2. Forecast (direct answer to the question, with a probability estimate in % and a confidence level)
3. How opinion evolved (turning points, who moved the discussion)
4. Factions and groups
5. Arguments that worked and arguments that failed
6. Risks and signals to watch
7. What to do (3-5 practical recommendations)`, 3500);
  saveSim(); renderReport();
}

async function interview(agent, question) {
  const myPosts = sim.posts.filter(p => p.author === agent.id).map(p => '- ' + p.text).join('\n') || '(wrote nothing)';
  const history = (sim.chats[agent.id] || []).slice(-4).map(c => `Q: ${c.q}\nA: ${c.a}`).join('\n');
  if (isDemo()) { await sleep(500); return demoInterview(agent); }
  return llm(`You are ${agent.nome}, ${agent.eta}, ${agent.ruolo}. Character: ${agent.personalita}. You care about: ${agent.motivazione}. Answer in first person, staying in character, naturally and honestly, max 120 words. Answer in the language the interviewer uses.`,
`Discussion context:
${sim.seed.slice(0, 2000)}

Your opinion moved from ${agent.posizione0.toFixed(2)} to ${agent.posizione.toFixed(2)} (scale -1 against, 1 in favour).
What you wrote:
${myPosts}
${history ? '\nPrevious conversation:\n' + history : ''}

The interviewer asks: ${question}`, 600);
}

const STOP = new Set(('della delle degli dello questo questa quella quello anche come sono perché quando dove sulla sulle nelle negli alla alle agli dalla dalle dagli hanno essere fatto fare molto tutti tutte ancora ogni senza oltre nostro nostra saranno sarebbe potrebbe dovrebbe mentre secondo prossimo ' +

function keywords() {

function demoAgents(n) {
  const d = D(); const names = [...d.names].sort(() => Math.random() - 0.5);
  return Array.from({ length: n }, (_, i) => {
    const [ruolo, gruppo] = pick(d.roles);
    return { nome: names[i % names.length], eta: Math.round(rnd(19, 74)), ruolo, gruppo, personalita: pick(d.chars), motivazione: pick(d.motives), posizione: clamp(rnd(-1, 1) * 0.8 + rnd(-0.2, 0.2)), influenza: Math.round(rnd(1, 10)) };

function demoRound(batch, ev) {
  const d = D(), k = keywords(); const posts = sim.posts.filter(p => p.type === 'post');
  const recent = posts.slice(-15), wt = p => 1 + (p.likes || 0) / 3;
  const feedAvg = recent.length ? recent.reduce((s, p) => s + p.sent * wt(p), 0) / recent.reduce((s, p) => s + wt(p), 0) : 0;
  const shock = ev.length ? rnd(-0.35, 0.35) : 0;
  return batch.map(a => {
    const pos = clamp(a.posizione + 0.12 * (feedAvg - a.posizione) * (1 - Math.abs(a.posizione) / 2) + shock + rnd(-0.08, 0.08));
    const roll = Math.random(), kw = pick(k);
    const tone = pos > 0.2 ? 'pos' : pos < -0.2 ? 'neg' : 'neu';
    const target = posts.length ? pick(posts.slice(-12)) : null;
    if (target && roll < 0.3) {
      const ta = agentById(target.author); const agree = Math.sign(target.sent) === Math.sign(pos);
      return { agente: a.id, azione: 'risposta', target: target.id, testo: pick(agree ? d.rpos : d.rneg).replace('{n}', ta ? ta.nome : '').replace('{k}', kw), sentimento: pos, posizione: pos };
    }
    if (target && roll < 0.55 && Math.sign(target.sent) === Math.sign(pos)) return { agente: a.id, azione: 'like', target: target.id, posizione: pos };
    if (roll < 0.85 || !posts.length) return { agente: a.id, azione: 'post', testo: pick(d[tone]).replace('{k}', kw), sentimento: pos, posizione: pos };
    return { agente: a.id, azione: 'silenzio', posizione: pos };
  });
}

  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll('#langs button').forEach(b => b.classList.toggle('on', b.dataset.l === settings.ui));
  const pv = $('#f-platform').value || PLATFORMS[0];
  $('#f-platform').innerHTML = PLATFORMS.map(k => `<option value="${k}">${esc(t(k))}</option>`).join('');
  $('#f-platform').value = pv;
  fillSettings(); updateEstimate(); renderAll();
}
function setUi(l) { if (!I18N[l]) return; settings.ui = l; saveSettings(); applyI18n(); }

function renderControls() {
  $('#s-title').textContent = sim ? sim.title : t('no_sim');
  $('#b-pause').disabled = !sim || (sim.status === 'done' && !running);
  $('#b-pause').textContent = running ? t('pause') : t('resume');
  $('#b-more').disabled = !sim || running || sim.round < sim.nRounds;
  if (!sim) { $('#s-step').textContent = t('create_first'); $('#status').textContent = t('ready'); $('#s-prog').style.width = '0'; return; }
  if (!running) {
    $('#s-prog').style.width = (sim.nRounds ? Math.round(100 * sim.round / sim.nRounds) : 0) + '%';
    const msg = sim.status === 'done' ? t('line_done', { a: sim.agents.length, r: sim.round, p: sim.posts.filter(p => p.type === 'post').length })
      : sim.status === 'error' ? t('error_msg', { e: sim.lastError || '' })
      : t('line_round', { r: sim.round, n: sim.nRounds, s: statusLabel(sim.status) });
    $('#s-step').textContent = msg; $('#status').textContent = sim.title;
  }
}
function renderChart() {
  const h = sim ? sim.stanceHistory : [];
  if (h.length < 1) { $('#chart').innerHTML = `<div class="empty">${esc(t('chart_empty'))}</div>`; $('#dist').innerHTML = ''; return; }
  const W = 340, H = 150, px = 28, py = 12;
  const x = i => px + (h.length === 1 ? (W - px - 10) / 2 : i * (W - px - 10) / (h.length - 1));
  const y = v => py + (1 - (v + 1) / 2) * (H - 2 * py - 12);
  const pts = h.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const evs = (sim.events || []).filter(e => e.round < h.length).map(e => `<line x1="${x(e.round)}" x2="${x(e.round)}" y1="${py}" y2="${H - 24}" stroke="var(--acc)" stroke-dasharray="3 3"/><text x="${x(e.round) + 3}" y="${py + 8}">⚡</text>`).join('');
  $('#chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(t('chart_title'))}">
    <rect x="${px}" y="${y(1)}" width="${W - px - 10}" height="${y(0.2) - y(1)}" fill="var(--pos)" opacity=".07"/>
    <rect x="${px}" y="${y(-0.2)}" width="${W - px - 10}" height="${y(-1) - y(-0.2)}" fill="var(--neg)" opacity=".07"/>
    <line x1="${px}" x2="${W - 10}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
    <text x="2" y="${y(1) + 4}">+1</text><text x="6" y="${y(0) + 4}">0</text><text x="2" y="${y(-1) + 4}">−1</text>
    ${h.map((_, i) => `<text x="${x(i) - 4}" y="${H - 6}">${i === 0 ? esc(t('start_lbl')) : i}</text>`).join('')}
    ${evs}
    <polyline points="${pts}" fill="none" stroke="url(#g)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${h.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${stanceColor(v)}"/>`).join('')}
    <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
  </svg>`;
  const n = sim.agents.length || 1;
  const f = sim.agents.filter(a => a.posizione > 0.2).length, c = sim.agents.filter(a => a.posizione < -0.2).length, u = sim.agents.length - f - c;
  $('#dist').innerHTML = `<div class="bars"><i style="width:${100 * f / n}%;background:var(--pos)"></i><i style="width:${100 * u / n}%;background:var(--neu)"></i><i style="width:${100 * c / n}%;background:var(--neg)"></i></div>
  <div class="legend"><span><i class="dot" style="background:var(--pos)"></i> ${esc(t('fav'))} ${f}</span><span><i class="dot" style="background:var(--neu)"></i> ${esc(t('und'))} ${u}</span><span><i class="dot" style="background:var(--neg)"></i> ${esc(t('con'))} ${c}</span></div>`;
}
function postHTML(p, reply) {
  const a = agentById(p.author) || { nome: '?', ruolo: '', id: 'x' };
  return `<div class="post${reply ? ' reply' : ''}">
    <div class="av" style="background:${color(a.id + a.nome)}">${esc(a.nome[0])}</div>
    <div class="pbody"><div class="pmeta"><b>${esc(a.nome)}</b><span>${esc(a.ruolo)}</span><span>· R${p.round}</span></div>
    <div class="ptext">${esc(p.text)}</div>
    <div class="pfoot"><span>♥ ${p.likes || 0}</span><span><i class="dot" style="background:${stanceColor(p.sent)}"></i> ${esc(t(p.sent > 0.2 ? 'pos' : p.sent < -0.2 ? 'neg' : 'neu'))}</span></div></div></div>`;
}
function renderFeed() {
  if (!sim || !sim.posts.length) { $('#feed').innerHTML = `<div class="empty">${esc(t(running ? 'feed_wait' : 'feed_empty'))}</div>`; return; }
  const tops = sim.posts.filter(p => !p.parent).slice().reverse();
  $('#feed').innerHTML = tops.map(p => p.type === 'evento'
    ? `<div class="event">⚡ <b>${esc(t('event_round', { r: p.round }))}</b><br>${esc(p.text)}</div>`
    : postHTML(p) + sim.posts.filter(x => x.parent === p.id).map(x => postHTML(x, true)).join('')).join('');
}
function renderAgents() {
  if (!sim || !sim.agents.length) { $('#agents').innerHTML = `<div class="empty">${esc(t('no_agents'))}</div>`; return; }
  $('#agents').innerHTML = [...sim.agents].sort((a, b) => b.influenza - a.influenza).map(a => {
    const v = a.posizione, d = v - a.posizione0;
    const left = v >= 0 ? 50 : 50 + v * 50, w = Math.abs(v) * 50;
    return `<div class="agent" data-id="${a.id}">
      <div class="av" style="background:${color(a.id + a.nome)}">${esc(a.nome[0])}</div>
      <div class="info"><b>${esc(a.nome)}</b> <span class="chip">${esc(a.gruppo)}</span>
      <small>${esc(t('years', { n: a.eta }))} · ${esc(a.ruolo)} · ${esc(t('influence', { n: a.influenza }))}</small>
      <div class="stance"><i style="left:${left}%;width:${w}%;background:${stanceColor(v)}"></i></div></div>
      <div style="font-size:12px;color:${Math.abs(d) < 0.05 ? 'var(--muted)' : d > 0 ? 'var(--pos)' : 'var(--neg)'};font-weight:700">${d > 0 ? '+' : ''}${d.toFixed(2)}</div></div>`;
  }).join('');
}
function md(src) {
  const lines = esc(src).split('\n'); let html = '', list = null;
  const inl = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|\s)\*(\S.*?)\*/g, '$1<i>$2</i>');
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const l of lines) {
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { close(); const n = Math.min(m[1].length + 1, 4); html += `<h${n}>${inl(m[2])}</h${n}>`; }
    else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; } html += `<li>${inl(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; } html += `<li>${inl(m[1])}</li>`; }
    else if ((m = l.match(/^&gt;\s?(.*)/))) { close(); html += `<p class="hint">${inl(m[1])}</p>`; }
    else if (!l.trim()) close();
    else { close(); html += `<p>${inl(l)}</p>`; }
  }
  close(); return html;
}
function renderReport() {
  $('#report').innerHTML = sim && sim.report ? md(sim.report) : `<div class="empty">${esc(t(sim && sim.agents.length ? 'report_wait' : 'report_none'))}</div>`;
}
function renderHistory() {
  const all = store.get('stormo.sims', []);
  $('#history').innerHTML = all.length ? all.map(s => `<div class="hist"><div class="t" data-open="${s.id}"><b>${esc(s.title)}</b><small>${new Date(s.created).toLocaleString(LOCALES[settings.ui], { dateStyle: 'short', timeStyle: 'short' })} · ${s.agents.length} ${esc(t('agents_n'))} · ${esc(statusLabel(s.status))}</small></div><button class="x" data-del="${s.id}" aria-label="×">×</button></div>`).join('') : `<div class="empty">${esc(t('no_saved'))}</div>`;
}
function renderProxy() {
  $('#c-proxy').checked = settings.proxy === true;
  $('#c-proxy').disabled = !proxyOK;
  $('#o-proxy').textContent = t(proxyOK ? 'proxy_on' : 'proxy_off');
}
function renderAll() { renderControls(); renderChart(); renderFeed(); renderAgents(); renderReport(); renderHistory(); }

function openAgent(id) {
  const a = agentById(id); if (!a) return;
  const posts = sim.posts.filter(p => p.author === a.id);
  const chat = sim.chats[a.id] || [];
  $('#sheet-body').innerHTML = `
    <div style="display:flex;gap:12px;align-items:center"><div class="av" style="width:46px;height:46px;font-size:18px;background:${color(a.id + a.nome)}">${esc(a.nome[0])}</div>
    <div><b style="font-size:17px">${esc(a.nome)}</b><div class="hint" style="margin:0">${esc(t('years', { n: a.eta }))} · ${esc(a.ruolo)} · ${esc(a.gruppo)}</div></div></div>
    <p><b>${esc(t('character'))}:</b> ${esc(a.personalita)}<br><b>${esc(t('cares'))}:</b> ${esc(a.motivazione)}<br><b>${esc(t('opinion'))}:</b> ${a.posizione0.toFixed(2)} → ${a.posizione.toFixed(2)} · ${esc(t('influence', { n: a.influenza + '/10' }))}</p>
    <h3>${esc(t('wrote', { n: posts.length }))}</h3>
    <div>${posts.length ? posts.map(p => postHTML(p)).join('') : `<div class="hint">${esc(t('only_likes'))}</div>`}</div>
    <h3 style="margin-top:14px">${esc(t('interview'))}</h3>
    <div id="chat">${chat.map(c => `<div class="bubble q">${esc(c.q)}</div><div class="bubble a">${esc(c.a)}</div>`).join('')}</div>
    <div class="row"><input id="q" placeholder="${esc(t('ask_ph'))}"><button class="btn small" id="b-ask">${esc(t('ask'))}</button></div>
    <div class="row"><button class="btn sec" id="b-close">${esc(t('close'))}</button></div>`;
  $('#sheet').classList.add('open');
  $('#b-close').onclick = () => $('#sheet').classList.remove('open');
  const ask = async () => {
    const q = $('#q').value.trim(); if (!q) return;
    $('#b-ask').disabled = true; $('#q').value = '';
    $('#chat').insertAdjacentHTML('beforeend', `<div class="bubble q">${esc(q)}</div><div class="bubble a" id="pending">…</div>`);
    try { const ans = await interview(a, q); (sim.chats[a.id] = sim.chats[a.id] || []).push({ q, a: ans }); $('#pending').outerHTML = `<div class="bubble a">${esc(ans)}</div>`; saveSim(); }
    catch (e) { $('#pending').outerHTML = `<div class="bubble a">⚠️ ${esc(e.message)}</div>`; }
    $('#b-ask').disabled = false;
  };
  $('#b-ask').onclick = ask;
  $('#q').onkeydown = e => { if (e.key === 'Enter') ask(); };
}

function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const slug = () => (sim.title || 'stormo').toLowerCase().replace(/[^a-z0-9а-яё]+/g, '-').replace(/^-|-$/g, '') || 'stormo';
function reportMarkdown() { return `# ${sim.title}\n\n**${t('question_lbl')}:** ${sim.question}\n\n${sim.report || ''}\n\n---\n${t('generated', { a: sim.agents.length, r: sim.round })}\n`; }

function updateEstimate() {
  const n = +$('#f-agents').value, r = +$('#f-rounds').value;
  $('#o-agents').textContent = n; $('#o-rounds').textContent = r;
  const calls = Math.ceil(n / 15) + r * Math.ceil(n / 6) + 1;
  $('#o-cost').textContent = isDemo() ? t('est_demo') : t('est', { c: calls, p: t(PRESETS[settings.provider].label) });
}
function fillSettings() {
  const sel = $('#c-provider');
  sel.innerHTML = Object.entries(PRESETS).map(([k, p]) => `<option value="${k}">${esc(t(p.label))}</option>`).join('');
  sel.value = settings.provider;
  const p = PRESETS[settings.provider];
  $('#c-ui').value = settings.ui;
  $('#c-base').value = settings.base || p.base; $('#c-model').value = settings.model || p.model; $('#c-key').value = settings.key;
  $('#c-lang').innerHTML = SIM_LANGS.map(l => `<option>${l}</option>`).join(''); $('#c-lang').value = settings.lang;
  $('#c-theme').value = settings.theme || '';
  ['#c-base', '#c-model', '#c-key'].forEach(s => $(s).disabled = isDemo());
  renderProxy();
}
function readSettings() {
  settings.provider = $('#c-provider').value;
  const p = PRESETS[settings.provider];
  settings.base = $('#c-base').value.trim() === p.base ? '' : $('#c-base').value.trim();
  settings.model = $('#c-model').value.trim() === p.model ? '' : $('#c-model').value.trim();
  settings.key = $('#c-key').value.trim(); settings.lang = $('#c-lang').value; settings.theme = $('#c-theme').value;
  if (proxyOK) settings.proxy = $('#c-proxy').checked;
}
function applyTheme() { if (settings.theme) document.documentElement.setAttribute('data-theme', settings.theme); else document.documentElement.removeAttribute('data-theme'); }

/* =================== eventi =================== */
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => show(b.dataset.v));
document.querySelectorAll('#langs button').forEach(b => b.onclick = () => setUi(b.dataset.l));
$('#c-ui').onchange = () => setUi($('#c-ui').value);
$('#f-agents').oninput = $('#f-rounds').oninput = updateEstimate;
$('#b-file').onclick = () => $('#f-file').click();
$('#f-file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => { $('#f-seed').value = String(r.result).slice(0, 20000); if (!$('#f-title').value) $('#f-title').value = f.name.replace(/\.[^.]+$/, ''); toast(t('loaded')); }; r.readAsText(f);
};
$('#b-example').onclick = () => { $('#f-title').value = t('ex_title'); $('#f-seed').value = t('ex_seed'); $('#f-question').value = t('ex_q'); $('#f-platform').value = 'p_local'; };
$('#b-start').onclick = () => {
  if (running) return toast(t('already'));
  if ($('#f-seed').value.trim().length < 20) return toast(t('seed_short'));
  sim = newSim(); pendingEvents = []; saveSim(); renderAll(); show('sim'); runSim();
};
$('#b-pause').onclick = () => {
  if (!sim) return;
  if (running) { paused = true; setStep(t('pausing'), null); }
  else runSim();
};
$('#b-more').onclick = () => { if (!sim || running) return; sim.nRounds++; runSim(); };
$('#b-event').onclick = () => {
  const x = $('#f-event').value.trim(); if (!x) return toast(t('describe_ev'));
  if (!sim) return toast(t('need_sim'));
  pendingEvents.push(x); $('#f-event').value = '';
  if (!running && sim.round >= sim.nRounds) { sim.nRounds++; runSim(); toast(t('ev_new')); }
  else toast(t('ev_queued'));
};
$('#b-report').onclick = async () => {
  if (!sim || !sim.agents.length) return toast(t('need_sim'));
  $('#b-report').disabled = true; $('#report').innerHTML = `<div class="empty">${esc(t('writing'))}</div>`;
  try { await genReport(); } catch (e) { toast(e.message); renderReport(); }
  $('#b-report').disabled = false;
};
$('#b-share').onclick = async () => {
  if (!sim || !sim.report) return toast(t('no_report'));
  const text = reportMarkdown();
  if (navigator.share) { try { await navigator.share({ title: sim.title, text }); } catch (e) {} }
  else { try { await navigator.clipboard.writeText(text); toast(t('copied')); } catch (e) { download(slug() + '.md', text, 'text/markdown'); } }
};
$('#b-md').onclick = () => { if (!sim) return toast(t('need_sim')); download(slug() + '.md', reportMarkdown(), 'text/markdown'); };
$('#b-json').onclick = () => { if (!sim) return toast(t('need_sim')); download(slug() + '.json', JSON.stringify(sim, null, 2), 'application/json'); };
$('#history').onclick = e => {
  const o = e.target.closest('[data-open]'), d = e.target.closest('[data-del]');
  if (d) { if (!confirm(t('del_q'))) return; store.set('stormo.sims', store.get('stormo.sims', []).filter(s => s.id !== d.dataset.del)); if (sim && sim.id === d.dataset.del && !running) sim = null; renderAll(); return; }
  if (o) { if (running) return toast(t('wait_run')); sim = store.get('stormo.sims', []).find(s => s.id === o.dataset.open); if (sim && !sim.lang) sim.lang = 'Italiano'; renderAll(); show(sim && sim.report ? 'report' : 'sim'); }
};
$('#agents').onclick = e => { const a = e.target.closest('.agent'); if (a) openAgent(a.dataset.id); };
$('#sheet').onclick = e => { if (e.target.id === 'sheet') $('#sheet').classList.remove('open'); };
$('#c-provider').onchange = () => { const k = $('#c-key').value; settings.provider = $('#c-provider').value; settings.base = ''; settings.model = ''; fillSettings(); $('#c-key').value = k; };
$('#b-save').onclick = () => { readSettings(); saveSettings(); applyTheme(); updateEstimate(); toast(t('saved_ok')); };
$('#b-test').onclick = async () => {
  readSettings(); if (isDemo()) return toast(t('demo_nc'));
  $('#b-test').disabled = true; toast(t('trying'));
  try { const r = await llm('Reply with the single word OK.', 'Test', 20); toast(t('conn_ok') + ' ' + r.trim().slice(0, 20)); saveSettings(); }
  catch (e) { toast(t('error_msg', { e: e.message })); }
  $('#b-test').disabled = false;
};

/* =================== avvio =================== */
sim = store.get('stormo.sims', [])[0] || null;
if (sim) { if (!sim.lang) sim.lang = 'Italiano'; if (sim.status === 'running' || sim.status === 'in corso') sim.status = 'paused'; }
applyTheme(); applyI18n(); detectProxy();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
